---
- hosts: jenkinservers
  become: true
  remote_user: ubuntu
  tasks:
    - name: updating apt and cache on all ubuntu servers
      apt:
        upgrade: yes
        update_cache: yes

    - name: Ensure keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download the current Jenkins GPG signing key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Setting up modern Jenkins repo using deb822
      ansible.builtin.deb822_repository:
        name: jenkins
        types: deb
        uris: https://pkg.jenkins.io/debian-stable
        suites: ./
        signed_by: /usr/share/keyrings/jenkins-keyring.asc
        state: present

    - name: Install OpenJDK Java 21 and dependencies
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present
        update_cache: yes

    - name: Installing jenkins software
      apt:
        name: jenkins
        state: present

    - name: Start and enable the Jenkins service
      service:
        name: jenkins
        state: started
        enabled: yes