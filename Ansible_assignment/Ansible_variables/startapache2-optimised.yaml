- name: installation of "{{appname}}"
  hosts: apache2server
  become: true
  vars:
   servicestate: started
   appstate: present
   appname: apache2
  tasks:
  - name: installing "{{appname}}"
    apt: 
      name: "{{appname}}"
      state: "{{appstate}}"

  - name: checking for "{{appname}}" service
    service:
      name: "{{appname}}"
      state: "{{servicestate}}"
      enabled: yes