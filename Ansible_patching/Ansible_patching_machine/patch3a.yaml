- name: "This playbook is to apply patches to ubuntu servers"
  hosts: webservers
  become: true
  tasks:
  - name: install apache2
    apt:
     name: apache2
     state: latest

  - name: "Check whether application and database are running"
    shell: /home/ansible/dev/appcheck.sh
    args:
      executable: /bin/bash
    ignore_errors: true
    register: application_process_check

  - name: "Will check and start patching on ubuntu servers"
    fail: msg='{{ inventory_hostname }} have running Application. Please stop application and then proceed with patch.'
    when: 
      - application_process_check.rc == 0
      - application_process_check.stdout is search("process is running")

  - name: "Applying patches to the server"
    apt:
      name: linux-generic
      state: latest
    when: 
      - ansible_distribution == "Ubuntu"
      - application_process_check.rc != 0 or application_process_check.stdout is search("Process is not running")
    register: patch_update

  - name: "Check if reboot required"
    shell: |
      KERNEL_NEW=$(dpkg -l | grep linux-image | awk '{print $2}' | tail -1 | sed 's/linux-image-//')
      KERNEL_NOW=$(uname -r)
      if [[ $KERNEL_NEW != $KERNEL_NOW ]]; then echo "reboot needed"; else echo "reboot not needed"; fi
    ignore_errors: true
    register: reboot_status
    
  - name: "This play is to restart the system using above status check"
    command: shutdown -r +1 "Rebooting System After Patching"
    async: 0
    poll: 0
    when: reboot_status.stdout is search("reboot needed")
    register: reboot_started
    ignore_errors: true

  - name: "This play will wait for 1 minutes for system to come up"
    pause: minutes=1
    
  - name: check the system status
    local_action: shell ansible -u ansible -m ping {{ inventory_hostname }}
    register: result
    until: result.rc == 0
    retries: 30
    delay: 10

  - name: check the client uptime
    shell: uptime